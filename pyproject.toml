[project]
name = "promethei-extractor"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Spisocheg", email = "spisocheg@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
]

[project.scripts]
promethei-extractor = "promethei_extractor.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
